<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!--
    WarpGate launcher icon.

    A shield (protection) with a knocked-out lightning bolt (WARP / speed),
    on a deep navy gradient. The geometry uses the 108x108 adaptive icon
    viewport, so the same path data is reused for the Android VectorDrawable
    layers (res/drawable/ic_launcher_foreground.xml) and for the legacy PNG
    mipmaps rendered by render-icons.mjs.

    The bolt is a hole in the shield (even-odd fill rule) instead of a second
    shape: the background layer shows through and the icon stays a single
    clean silhouette at 48 dp.
  -->
  <defs>
    <clipPath id="shape">
      <rect x="0" y="0" width="108" height="108" rx="24" />
    </clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18243F" />
      <stop offset="1" stop-color="#070B14" />
    </linearGradient>

    <linearGradient id="shield" x1="0.16" y1="0" x2="0.86" y2="1">
      <stop offset="0" stop-color="#8AB0FF" />
      <stop offset="0.5" stop-color="#4F7CFF" />
      <stop offset="1" stop-color="#9B5CFF" />
    </linearGradient>
  </defs>

  <g clip-path="url(#shape)">
    <rect x="0" y="0" width="108" height="108" fill="url(#bg)" />
    <path fill="url(#shield)" fill-rule="evenodd" d="
      M54,23.2
      C63.3,23.2 71.7,26.2 77.2,28.7
      L77.2,50.6
      C77.2,64.6 67.5,78.5 55.7,85.6
      C54.9,86.1 53.1,86.1 52.3,85.6
      C40.5,78.5 30.8,64.6 30.8,50.6
      L30.8,28.7
      C36.3,26.2 44.7,23.2 54,23.2
      Z
      M60.3,33.8
      L44.7,58.6
      L52.7,58.6
      L49.4,78.5
      L67.1,52.7
      L57.8,52.7
      Z
    " />
  </g>
</svg>
