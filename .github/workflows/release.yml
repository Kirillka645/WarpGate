name: Release APK

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Set up NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          "$(go env GOPATH)/bin/gomobile" init

      - name: Build Go core AAR
        working-directory: warpcore
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          "$(go env GOPATH)/bin/gomobile" bind -target=android -androidapi 26 -o warpcore.aar .
          mkdir -p ../warpgate/app/libs
          cp warpcore.aar ../warpgate/app/libs/warpcore.aar

      - name: Build APK
        working-directory: warpgate
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp warpgate/app/build/outputs/apk/debug/app-debug.apk "dist/WarpGate-v${VERSION}-debug.apk"
          echo "name=WarpGate-v${VERSION}-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: dist/${{ steps.apk.outputs.name }}
          fail_on_unmatched_files: true
